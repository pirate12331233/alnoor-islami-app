name: Alnoor Islamic CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.2.0)'
        required: false
        default: '1.2.0'
      min_supported_version:
        description: 'Minimum Supported Version Code (to force older versions to update)'
        required: false
        default: '1'
      force_update:
        description: 'Enforce Mandatory Forced Update on all devices'
        type: boolean
        required: true
        default: false
      release_notes:
        description: 'Release Notes / What is New'
        required: false
        default: 'Automated CI/CD build with latest cloud synchronization and performance enhancements.'

jobs:
  build-and-release:
    name: Build APK & Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Setup Signing Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Setup Release upload key
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "Generating automated release upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Alnoor, OU=Dev, O=Alnoor, L=City, S=State, C=US"
          fi

          # 2. Setup debug.keystore if not present
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for build..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Generate Build Version Code & Name
        id: version_calc
        run: |
          BUILD_NUM=${{ github.run_number }}
          # Check if triggered by a Git tag (e.g. v1.2.5)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            VERSION_NAME="$TAG_VERSION"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            # Extract current base version from build.gradle.kts (e.g. 1.2.0)
            BASE_VER=$(grep -E 'val vName.*=.*"[0-9.]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
            if [ -z "$BASE_VER" ]; then
              BASE_VER="1.2.0"
            fi
            VERSION_NAME="$BASE_VER"
          fi
          
          # Version code is uniquely incremented with each GitHub build
          VERSION_CODE=$((BUILD_NUM + 10))
          
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Computed build: v$VERSION_NAME (versionCode=$VERSION_CODE)"

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          BUILD_CODE="${{ steps.version_calc.outputs.version_code }}"
          BUILD_NAME="${{ steps.version_calc.outputs.version_name }}"
          echo "Building APK with versionCode=$BUILD_CODE, versionName=$BUILD_NAME..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease -PappVersionCode=$BUILD_CODE -PappVersionName="$BUILD_NAME" --stacktrace || ./gradlew assembleDebug -PappVersionCode=$BUILD_CODE -PappVersionName="$BUILD_NAME" --stacktrace
          else
            gradle assembleRelease -PappVersionCode=$BUILD_CODE -PappVersionName="$BUILD_NAME" --stacktrace || gradle assembleDebug -PappVersionCode=$BUILD_CODE -PappVersionName="$BUILD_NAME" --stacktrace
          fi

      - name: Locate Built APK File
        id: find_apk
        run: |
          RAW_APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $RAW_APK_PATH"

          # Standardize filename to app-release.apk for predictable release URLs
          STANDARDIZED_PATH="app/build/outputs/apk/app-release.apk"
          if [ "$RAW_APK_PATH" != "$STANDARDIZED_PATH" ]; then
            cp "$RAW_APK_PATH" "$STANDARDIZED_PATH"
          fi

          echo "apk_path=$STANDARDIZED_PATH" >> $GITHUB_OUTPUT
          
          # Extract file size in MB
          FILE_SIZE_BYTES=$(wc -c < "$STANDARDIZED_PATH")
          FILE_SIZE_MB=$(echo "scale=1; $FILE_SIZE_BYTES / 1048576" | bc)
          echo "apk_size=${FILE_SIZE_MB} MB" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnoor-app-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # -------------------------------------------------------------
      # Automated Cloud Storage Cleanup (Delete Old APKs to Save Storage)
      # -------------------------------------------------------------
      - name: Clean Up Old Cloud Releases & Assets
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 20
              });
              
              // Keep only the latest release and delete older release APK assets to conserve cloud storage
              if (releases.data && releases.data.length > 2) {
                console.log(`Found ${releases.data.length} releases. Cleaning up old APK release artifacts to save storage...`);
                for (let i = 2; i < releases.data.length; i++) {
                  const oldRelease = releases.data[i];
                  for (const asset of oldRelease.assets) {
                    if (asset.name.endsWith('.apk')) {
                      console.log(`Deleting old APK asset: ${asset.name} (ID: ${asset.id}) from Release ${oldRelease.tag_name}`);
                      await github.rest.repos.deleteReleaseAsset({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        asset_id: asset.id
                      });
                    }
                  }
                }
              }
            } catch (err) {
              console.log('Cleanup step skipped or encountered non-fatal error:', err.message);
            }

      # -------------------------------------------------------------
      # Create Latest Cloud Release with Direct APK Download
      # -------------------------------------------------------------
      - name: Publish Latest Release APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_calc.outputs.version_name }}-b${{ steps.version_calc.outputs.version_code }}
          name: Alnoor Islamic App v${{ steps.version_calc.outputs.version_name }} (Build ${{ steps.version_calc.outputs.version_code }})
          make_latest: true
          body: |
            ## Alnoor Islamic App Release v${{ steps.version_calc.outputs.version_name }}
            
            ${{ github.event.inputs.release_notes || 'Automated CI/CD build with live cloud synchronization and performance updates.' }}
            
            - **Build Number**: ${{ steps.version_calc.outputs.version_code }}
            - **Package Size**: ${{ steps.find_apk.outputs.apk_size }}
            - **Direct Download**: [Download app-release.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version_calc.outputs.version_name }}-b${{ steps.version_calc.outputs.version_code }}/app-release.apk)
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # Update Firestore Cloud App Version Document & Trigger Forced Update
      # -------------------------------------------------------------
      - name: Update Cloud App Version in Firebase Firestore
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"
          VERSION_CODE="${{ steps.version_calc.outputs.version_code }}"
          VERSION_NAME="${{ steps.version_calc.outputs.version_name }}"
          MIN_SUPPORTED="${{ github.event.inputs.min_supported_version || '1' }}"
          IS_FORCED="${{ github.event.inputs.force_update || 'true' }}"
          RELEASE_NOTES="${{ github.event.inputs.release_notes || '• Important performance & stability updates\n• Login poster popup enhancements\n• Real-time cloud sync' }}"
          APK_SIZE="${{ steps.find_apk.outputs.apk_size }}"
          NOW_MS=$(date +%s%3N)
          
          echo "Updating Firestore app_version_info with version $VERSION_NAME (build $VERSION_CODE)..."
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "fields": {
              "latestVersionCode": { "integerValue": "$VERSION_CODE" },
              "latestVersionName": { "stringValue": "$VERSION_NAME" },
              "minSupportedVersionCode": { "integerValue": "$MIN_SUPPORTED" },
              "isForcedUpdate": { "booleanValue": $IS_FORCED },
              "apkDownloadUrl": { "stringValue": "$APK_DOWNLOAD_URL" },
              "releaseNotes": { "stringValue": "$RELEASE_NOTES" },
              "releaseDate": { "stringValue": "$(date '+%B %d, %Y')" },
              "apkSizeMb": { "stringValue": "$APK_SIZE" },
              "lastUpdated": { "integerValue": "$NOW_MS" }
            }
          }
          EOF
          )
          
          # Patch Firestore app_settings/app_version_info document
          curl -s -X PATCH \
            "https://firestore.googleapis.com/v1/projects/alnoor-islami-8763b/databases/(default)/documents/app_settings/app_version_info?key=AIzaSyBmV50_gdE4t36Fqje4nvAfJwadHrZgMNE" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
            
          # Touch manifest to immediately notify all active mobile devices
          MANIFEST_PAYLOAD=$(cat <<EOF
          {
            "fields": {
              "app_version_v": { "integerValue": "$NOW_MS" },
              "lastUpdated": { "integerValue": "$NOW_MS" }
            }
          }
          EOF
          )
          
          curl -s -X PATCH \
            "https://firestore.googleapis.com/v1/projects/alnoor-islami-8763b/databases/(default)/documents/app_settings/sync_manifest?updateMask.fieldPaths=app_version_v&updateMask.fieldPaths=lastUpdated&key=AIzaSyBmV50_gdE4t36Fqje4nvAfJwadHrZgMNE" \
            -H "Content-Type: application/json" \
            -d "$MANIFEST_PAYLOAD"
            
          echo "Cloud App Version and Manifest successfully updated! All active and starting devices will now receive the update notice."
